name: Release Android and iOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (never moved)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-ios:
    name: Verify iOS release build
    uses: ./.github/workflows/ios.yml
    with:
      source_ref: refs/tags/${{ inputs.tag || github.ref_name }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.release.outputs.version_name }}
      build_number: ${{ steps.release.outputs.build_number }}
      build_time: ${{ steps.release.outputs.build_time }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    env:
      FLUTTER_VERSION: "3.47.2"
      PUB_HOSTED_URL: "https://pub.dev"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag must use SemVer, for example v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          pub_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          if [[ ! "$pub_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)\+([1-9][0-9]*)$ ]]; then
            echo "::error::pubspec.yaml must declare a version and positive build number, for example 0.1.0+1"
            exit 1
          fi
          version_name="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[4]}"
          if [[ "${RELEASE_TAG#v}" != "$version_name" ]]; then
            echo "::error::Release tag must match pubspec.yaml version: v$version_name"
            exit 1
          fi

          python3 -m unittest discover -s tool -p 'test_*release*.py'

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/fknotes_harness && dart pub get --enforce-lockfile)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --no-pub

  test:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      FLUTTER_VERSION: "3.47.2"
      PUB_HOSTED_URL: "https://pub.dev"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: flutter test --no-pub --total-shards=2 --shard-index=${{ matrix.shard }}

  build-apk:
    name: Build APK (${{ matrix.abi }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: universal
            target_platform: android-arm,android-arm64,android-x64
          - abi: armeabi-v7a
            target_platform: android-arm
          - abi: arm64-v8a
            target_platform: android-arm64
          - abi: x86_64
            target_platform: android-x64
    env:
      FLUTTER_VERSION: "3.47.2"
      PUB_HOSTED_URL: "https://pub.dev"
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/fknotes-release.jks
      FKNOTES_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/updates/android/latest.json
      VERSION_NAME: ${{ needs.verify.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      BUILD_TIME: ${{ needs.verify.outputs.build_time }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed ${{ matrix.abi }} APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail

          split_args=()
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          if [[ "$ABI" != universal ]]; then
            split_args+=(--split-per-abi)
            apk_path="build/app/outputs/flutter-apk/app-$ABI-release.apk"
          fi

          flutter build apk \
            --release \
            --no-pub \
            "${split_args[@]}" \
            --target-platform "$TARGET_PLATFORM" \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="FKNOTES_BUILD_TIME=$BUILD_TIME" \
            --dart-define="FKNOTES_UPDATE_MANIFEST_URL=$FKNOTES_UPDATE_MANIFEST_URL"

          python3 tool/check_android_release.py "$apk_path"
          mkdir -p dist
          cp "$apk_path" \
            "dist/fknotes-$VERSION_NAME+$BUILD_NUMBER-$ABI-release.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fknotes-${{ env.RELEASE_TAG }}-input-apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  build-aab:
    name: Build AAB
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: "3.47.2"
      PUB_HOSTED_URL: "https://pub.dev"
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/fknotes-release.jks
      FKNOTES_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/updates/android/latest.json
      VERSION_NAME: ${{ needs.verify.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      BUILD_TIME: ${{ needs.verify.outputs.build_time }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          flutter build appbundle \
            --release \
            --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="FKNOTES_BUILD_TIME=$BUILD_TIME" \
            --dart-define="FKNOTES_UPDATE_MANIFEST_URL=$FKNOTES_UPDATE_MANIFEST_URL"

          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/fknotes-$VERSION_NAME+$BUILD_NUMBER-release.aab"

      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Check AAB for developer paths
        run: python3 tool/check_android_release.py dist/*.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fknotes-${{ env.RELEASE_TAG }}-input-aab
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - verify
      - verify-ios
      - test
      - build-apk
      - build-aab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      VERSION_NAME: ${{ needs.verify.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      BUILD_TIME: ${{ needs.verify.outputs.build_time }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      FKNOTES_UPDATE_MANDATORY: ${{ vars.FKNOTES_UPDATE_MANDATORY || 'false' }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check out release tools from the workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/prepare_github_release.py

      - name: Resolve release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tool/release_notes.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download release artifacts
        if: steps.notes.outputs.state != 'published'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fknotes-${{ env.RELEASE_TAG }}-input-*
          path: dist
          merge-multiple: true

      - name: Generate update manifest and checksums
        if: steps.notes.outputs.state != 'published'
        run: |
          python3 .release-tooling/tool/prepare_github_release.py \
            --dist dist \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --date "${BUILD_TIME%%T*}" \
            --mandatory "$FKNOTES_UPDATE_MANDATORY" \
            --require-ios

      - name: Upload combined workflow artifact
        if: steps.notes.outputs.state != 'published'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fknotes-${{ env.RELEASE_TAG }}-mobile
          path: |
            dist/*.apk
            dist/*.aab
            dist/*.ipa
            dist/ios-*
            dist/SHA256SUMS.txt
            dist/latest.json
            dist/notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ steps.notes.outputs.state }}
        run: |
          set -euo pipefail

          # Never replace a published release's body or assets on retries.
          if [[ "$RELEASE_STATE" == draft ]]; then
            # Abort if someone published the draft after notes were resolved.
            current_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$current_draft" != true ]]; then
              echo "::error::Release was published during this run; retry to reuse its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              dist/*.apk dist/*.aab dist/*.ipa dist/ios-* dist/SHA256SUMS.txt dist/latest.json dist/notes.md \
              --clobber --repo "$GITHUB_REPOSITORY"
            arguments=(release edit "$RELEASE_TAG" --draft=false
              --notes-file dist/notes.md --repo "$GITHUB_REPOSITORY")
            if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh "${arguments[@]}"
          elif [[ "$RELEASE_STATE" == missing ]]; then
            arguments=(
              release create "$RELEASE_TAG"
              dist/*.apk dist/*.aab dist/*.ipa dist/ios-* dist/SHA256SUMS.txt dist/latest.json dist/notes.md
              --verify-tag
              --notes-file dist/notes.md
              --title "FKNotes $RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
            )
            if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh "${arguments[@]}"
          fi

          # Always use the published manifest, including when retrying a completed release.
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir published
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("published/latest.json").read_text())
          assert manifest["app"] == "fknotes"
          assert manifest["version"] == os.environ["VERSION_NAME"]
          assert manifest["versionCode"] == int(os.environ["BUILD_NUMBER"])
          PY

      - name: Publish Android update feed
        run: python3 tool/publish_update_feed.py published/latest.json
