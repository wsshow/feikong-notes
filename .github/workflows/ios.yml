name: Verify iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'native/**'
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'third_party/flutter_quill/**'
      - 'third_party/litert_lm/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.*'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unsigned iPhone build and native checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Verify without device or signing
        run: make check-ios
      - name: Verify archive exports without signing
        run: make ios-archive IOS_ARCHIVE_ARGS="--unsigned"
