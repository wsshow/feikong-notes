name: Verify iOS

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'native/**'
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'packages/**'
      - 'third_party/flutter_quill/**'
      - 'third_party/litert_lm/**'
      - 'third_party/google_mlkit_text_recognition/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.*'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unsigned iPhone build and native checks
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Verify without device or signing
        run: make check-ios
      - name: Verify archive exports without signing
        run: make ios-archive IOS_ARCHIVE_ARGS="--unsigned"
      - name: Check out IPA tooling from the workflow revision
        if: inputs.release_tag != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/package_ios_release.py
            /tool/verify_ios_bundle.py
      - name: Package experimental unsigned IPA
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          python3 .release-tooling/tool/package_ios_release.py \
            --archive build/ios/archive/Runner.xcarchive \
            --dist dist \
            --version "${RELEASE_TAG#v}" \
            --build-number "$(sed -n 's/^version:.*+//p' pubspec.yaml)" \
            --source-commit "$(git rev-parse HEAD)" \
            --tooling-commit "$TOOLING_SHA"
      - name: Upload unsigned IPA and CI build info
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fknotes-${{ inputs.release_tag }}-input-ios
          path: |
            dist/*.ipa
            dist/ios-build-info.json
          if-no-files-found: error
          retention-days: 14
