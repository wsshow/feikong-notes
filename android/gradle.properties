# Keep Gradle within the memory available on standard CI runners.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Flutter 3.47+ supports AGP 9's built-in Kotlin implementation.
android.builtInKotlin=true
# GitHub APKs and the AAB share the manifest's build number; no per-ABI offsets.
# Flutter 3.47 supports this property for both CLI and direct Gradle builds.
force-version-code-ignoring-abi=true
